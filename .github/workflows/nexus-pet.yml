name: Nexus Pet (Android)

on:
  push:
    paths:
      - 'apps/nexus-pet/**'
      - '.github/workflows/nexus-pet.yml'
  workflow_dispatch:

permissions:
  contents: write      # für das GitHub-Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Spiel-Logik testen
        run: sh apps/nexus-pet/tests/run.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Festen Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt – Nexus Pet bekommt die Debug-Signatur."
          fi
      - name: APK bauen
        run: gradle -p apps/nexus-pet assembleRelease --no-daemon
      - name: Umbenennen
        run: |
          VER=$(cat apps/nexus-pet/version.txt)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp apps/nexus-pet/app/build/outputs/apk/release/app-release.apk "Nexus-Pet-$VER.apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Pet
          path: Nexus-Pet-*.apk
      - name: GitHub-Release (gleiche Version = APK ersetzt)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="nexus-pet-v$VER"
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" --title "Nexus Pet $VER" --notes "Virtuelles Haustier für Android (eigene Geistlinge). APK herunterladen und installieren."
          gh release upload "$TAG" -R "$REPO" --clobber Nexus-Pet-*.apk
