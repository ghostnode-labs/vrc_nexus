name: VRC Nexus App (Android)

on:
  push:
    paths:
      - 'apps/vrc-nexus-android/**'
      - 'apps/vrc-nexus-watch/**'
      - 'apps/nexus-pet/**'
      - 'apps/twitch-extension/**'
      - 'apps/vrc-nexus/backend/**'
      - 'apps/vrc-nexus/renderer/**'
      - '.github/workflows/vrc-nexus-android.yml'
  workflow_dispatch:

permissions:
  contents: write      # für das automatische GitHub-Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Abhängigkeiten
        working-directory: apps/vrc-nexus-android
        run: npm ci
      - name: Discord-Link setzen (Secret oder Variable DISCORD_INVITE)
        working-directory: apps/vrc-nexus
        env:
          DISCORD_INVITE: ${{ secrets.DISCORD_INVITE || vars.DISCORD_INVITE }}
          PATREON_URL: ${{ secrets.PATREON_URL || vars.PATREON_URL }}
          PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
        run: |
          node scripts/set-links.js
          node scripts/patreon-supporters.js
      - name: Oberfläche + Backend bündeln
        working-directory: apps/vrc-nexus-android
        run: node build.mjs
      - name: Android-Projekt erzeugen
        working-directory: apps/vrc-nexus-android
        run: |
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/* android/app/src/main/res/
          sh native/install.sh
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          CODE=$(node -p "require('../vrc-nexus/backend/version').code(require('./package.json').version)")   # alt a*10000+b*100+c, ab „10“ Datum
          sed -i "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android
      - name: Festen Signierschlüssel verwenden (Updates über die installierte App)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
            # die Debug-Signatur ausdrücklich auf den festen Schlüssel umstellen
            cat >> apps/vrc-nexus-android/android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('NEXUS_KEYSTORE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
            echo "Fester Schlüssel aus dem Secret ANDROID_KEYSTORE_B64 wird verwendet."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt – die APK bekommt einen zufälligen Schlüssel und lässt sich nicht über eine ältere Version installieren."
          fi
      - name: APK bauen
        working-directory: apps/vrc-nexus-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Signatur prüfen
        run: |
          APK=apps/vrc-nexus-android/android/app/build/outputs/apk/debug/app-debug.apk
          GOT=$(keytool -printcert -jarfile "$APK" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "APK-Zertifikat: $GOT"
          if [ -n "$NEXUS_KEYSTORE" ]; then
            WANT=$(keytool -list -v -keystore "$NEXUS_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
            echo "Erwartet:       $WANT"
            [ "$GOT" = "$WANT" ] || { echo "::error::APK ist nicht mit dem festen Schlüssel signiert"; exit 1; }
          fi
      - name: APK umbenennen
        run: cp apps/vrc-nexus-android/android/app/build/outputs/apk/debug/app-debug.apk "VRC-Nexus-$(node -p "require('./apps/vrc-nexus-android/package.json').version")-android.apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Nexus-Android
          path: |
            VRC-Nexus-*-android.apk
            apps/vrc-nexus-android/README.md
      - name: GitHub-Release aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          CL=$(node apps/vrc-nexus/scripts/release-notes.js "$VER")
          TAG="vrc-nexus-v$VER"
          MSG=$(printf '%s' "$HEAD_MSG" | head -n 1)
          NOTES=$(printf '%s\n' "## VRC Nexus $VER" "" "$CL" "" \
            "| File | What for |" "|---|---|" \
            "| VRC-Nexus-$VER-Setup.exe | Windows installer |" \
            "| VRC-Nexus-$VER-portable.exe | Windows portable (no install) |" \
            "| VRC-Nexus-$VER-android.apk | Android (without PC features) |" \
            "| VRC-Nexus-Watch-$VER-wearos.apk | Wear OS watch app (heart rate, panic, quick actions) |" \
            "| VRC-Nexus-WatchFace-$VER-wearos.apk | VRC Nexus watch face (Wear OS 4+, set as default watch face) |" \
            "| Nexus-Pet-$(cat apps/nexus-pet/version.txt).apk | Nexus Pet – virtual pet for Android (separate app) |" \
            "| VRC-Nexus-Twitch-Extension.zip | Twitch panel extension (upload in the Twitch developer console) |" \
            "| VRC-Nexus.streamDeckPlugin | Stream Deck plugin (double-click to install) |" "" \
            "The Windows files are still being built. Unsigned: Windows SmartScreen → “More info” → “Run anyway”; Android asks to allow installing from unknown sources." "" \
            "Build: ${GITHUB_SHA:0:7} · $(date -u '+%Y-%m-%d %H:%M') UTC")
          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" --title "VRC Nexus $VER" --notes "$NOTES" || sleep 15
          fi
          gh release upload "$TAG" -R "$REPO" --clobber VRC-Nexus-*-android.apk
          # Notizen nur übernehmen, solange der Windows-Build sie noch nicht geschrieben hat (der kennt den Signatur-Stand)
          if ! gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep -q 'Setup.exe$'; then gh release edit "$TAG" -R "$REPO" --notes "$NOTES"; fi

  # 5.2: Wear-OS-App „Nexus Watch“ (reines Java, keine Bibliotheken) – nach der Handy-APK, damit das Release schon existiert
  watch:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Festen Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt – die Uhr-APK bekommt die Debug-Signatur."
          fi
      - name: Uhr-APK bauen
        run: gradle -p apps/vrc-nexus-watch :app:assembleRelease --no-daemon
      - name: Umbenennen
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          cp apps/vrc-nexus-watch/app/build/outputs/apk/release/app-release.apk "VRC-Nexus-Watch-$VER-wearos.apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Nexus-Watch
          path: VRC-Nexus-Watch-*-wearos.apk
      - name: An das GitHub-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          gh release upload "vrc-nexus-v$VER" -R "$REPO" --clobber VRC-Nexus-Watch-*-wearos.apk

  # 8.1.1: Zifferblatt „VRC Nexus“ (Watch Face Format, nur XML) – eigener Job, damit ein Fehler hier nie die Uhr-App aufhält
  watchface:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Festen Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
          fi
      - name: Zifferblatt bauen
        run: gradle -p apps/vrc-nexus-watch :watchface:assembleRelease --no-daemon
      - name: Umbenennen
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          cp apps/vrc-nexus-watch/watchface/build/outputs/apk/release/watchface-release.apk "VRC-Nexus-WatchFace-$VER-wearos.apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Nexus-WatchFace
          path: VRC-Nexus-WatchFace-*-wearos.apk
      - name: An das GitHub-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          gh release upload "vrc-nexus-v$VER" -R "$REPO" --clobber VRC-Nexus-WatchFace-*-wearos.apk

  # Nexus Pet (virtuelles Haustier, reines Java) – hängt mit am VRC-Nexus-Release, damit es auf der Webseite (Dashboard, Downloads, Changelog) erscheint
  pet:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Spiel-Logik testen
        run: sh apps/nexus-pet/tests/run.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Festen Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt – Nexus Pet bekommt die Debug-Signatur."
          fi
      - name: APK bauen
        run: gradle -p apps/nexus-pet assembleRelease --no-daemon
      - name: Umbenennen
        run: cp apps/nexus-pet/app/build/outputs/apk/release/app-release.apk "Nexus-Pet-$(cat apps/nexus-pet/version.txt).apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Pet
          path: Nexus-Pet-*.apk
      - name: An das VRC-Nexus-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          gh release upload "vrc-nexus-v$VER" -R "$REPO" --clobber Nexus-Pet-*.apk

  # 7.2: Twitch-Panel-Erweiterung als ZIP (zum Hochladen in der Twitch-Entwicklerkonsole) am Release
  twitch:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen und packen
        run: |
          cd apps/twitch-extension
          for f in *.js; do node --check "$f"; done
          ! grep -n "<script>" *.html
          zip -j ../../VRC-Nexus-Twitch-Extension.zip panel.html config.html common.js panel.js config.js style.css
      - name: An das VRC-Nexus-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          gh release upload "vrc-nexus-v$VER" -R "$REPO" --clobber VRC-Nexus-Twitch-Extension.zip
