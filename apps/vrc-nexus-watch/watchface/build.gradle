plugins { id 'com.android.application' }

// 8.1.1: VRC-Nexus-Zifferblatt im Watch Face Format (nur XML, kein Programmcode) – als Standard-Zifferblatt auswählbar.
// Gleiche Versionsnummer wie VRC Nexus.
def pkg = new groovy.json.JsonSlurper().parse(file('../../vrc-nexus-android/package.json'))
def (va, vb, vc) = pkg.version.tokenize('.').collect { it as int }

android {
    namespace 'dev.ghostnode.nexuswatch.face'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.ghostnode.nexuswatch.face'
        minSdk 33          // Watch Face Format braucht Wear OS 4 (API 33)
        targetSdk 34
        versionCode va >= 2000 ? (va - 2000) * 1000000 + vb * 100 + vc : va * 10000 + vb * 100 + vc
        versionName pkg.version
    }
    signingConfigs {
        nexus {
            def ks = System.getenv('NEXUS_KEYSTORE')
            if (ks) { storeFile file(ks); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('NEXUS_KEYSTORE') ? signingConfigs.nexus : signingConfigs.debug
        }
    }
}
