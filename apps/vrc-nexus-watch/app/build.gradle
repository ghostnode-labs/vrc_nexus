plugins { id 'com.android.application' }

// Version aus der Android-App (gleiche Versionsnummer wie VRC Nexus)
def pkg = new groovy.json.JsonSlurper().parse(file('../../vrc-nexus-android/package.json'))
def (va, vb, vc) = pkg.version.tokenize('.').collect { it as int }

android {
    namespace 'dev.ghostnode.nexuswatch'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.ghostnode.nexuswatch'
        minSdk 30          // Wear OS 3+ (Galaxy Watch 4 und neuer)
        targetSdk 34
        versionCode va >= 2000 ? (va - 2000) * 1000000 + vb * 100 + vc : va * 10000 + vb * 100 + vc   // ab „10“: Datums-Version 2026.1127.1
        versionName pkg.version
    }
    signingConfigs {
        nexus {
            def ks = System.getenv('NEXUS_KEYSTORE')
            if (ks) { storeFile file(ks); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('NEXUS_KEYSTORE') ? signingConfigs.nexus : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}

// 8.2: Kacheln (Wear OS Tiles) und Komplikations-Datenquelle – nur Google/AndroidX, feste Versionen (passen zu compileSdk 34 / AGP 8.5)
dependencies {
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'        // CallbackToFutureAdapter (ListenableFuture ohne Guava)
    implementation 'com.google.guava:listenablefuture:1.0'                // nur die Schnittstelle ListenableFuture
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
}
