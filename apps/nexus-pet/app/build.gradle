plugins { id 'com.android.application' }

// eigene Versionsnummer (version.txt) – unabhängig von VRC Nexus
def ver = file('../version.txt').text.trim()
def (va, vb, vc) = ver.tokenize('.').collect { it as int }

android {
    namespace 'dev.ghostnode.nexuspet'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.ghostnode.nexuspet'
        minSdk 26          // Android 8+
        targetSdk 34
        versionCode va * 10000 + vb * 100 + vc
        versionName ver
    }
    signingConfigs {
        nexus {
            def ks = System.getenv('NEXUS_KEYSTORE')
            if (ks) { storeFile file(ks); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('NEXUS_KEYSTORE') ? signingConfigs.nexus : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
