<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VRC Nexus Mini</title>
<link rel="stylesheet" href="css/themes.css">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-color, #040609); color: var(--text-main, #e2e8f0); font: 13px/1.3 "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; border: 1px solid rgba(var(--accent-rgb, 56, 213, 230), .45); box-sizing: border-box; }
    .top { display: flex; align-items: center; gap: 6px; padding: 5px 8px; -webkit-app-region: drag; background: rgba(var(--accent-rgb, 56, 213, 230), .08); border-bottom: 1px solid rgba(var(--accent-rgb, 56, 213, 230), .25); }
    .top b { flex: 1; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-gold, #f5c242); }
    .top button { -webkit-app-region: no-drag; width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: var(--text-muted, #94a3b8); cursor: pointer; }
    .top button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .info { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; align-content: start; }
    .tile { padding: 6px 8px; border-radius: 6px; background: rgba(255, 255, 255, .04); min-width: 0; }
    .tile.wide { grid-column: 1 / -1; }
    .tile small { display: block; color: var(--text-muted, #94a3b8); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .tile span { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile.hr span { color: #ff5c7a; }
    .acts { display: flex; gap: 4px; padding: 0 8px 8px; }
    .acts button { flex: 1; height: 30px; border: 1px solid rgba(var(--accent-rgb, 56, 213, 230), .35); border-radius: 6px; background: rgba(var(--accent-rgb, 56, 213, 230), .06); color: inherit; font-size: 15px; cursor: pointer; }
    .acts button.on { background: rgba(var(--accent-rgb, 56, 213, 230), .3); }
    .acts button.panic { border-color: rgba(255, 80, 100, .6); }
    .msg { position: fixed; left: 8px; right: 8px; bottom: 44px; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, .8); font-size: 12px; text-align: center; }
    [hidden] { display: none !important; }
</style>
</head>
<body data-i18n-nocorner>
<div class="top"><b>VRC Nexus</b><button type="button" id="mOpen" title="Hauptfenster öffnen">⤢</button><button type="button" id="mClose" title="Mini-Modus schließen">✕</button></div>
<div class="info" id="mInfo"></div>
<div class="acts" id="mActs"></div>
<div class="msg" id="mMsg" hidden></div>
<script src="js/i18n-dict.js"></script>
<script src="js/nexus-i18n.js"></script>
<script src="js/nexus-mini.js"></script>
</body>
</html>
